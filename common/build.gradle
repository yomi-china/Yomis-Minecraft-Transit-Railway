dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version[1]}"
	modApi "${rootProject.architectury_id}:architectury:${rootProject.architectury_data[0].split("\\+")[0]}"
	compileOnly files("${rootProject.projectDir}/libs/MSD1.3.4-common.jar")
}

architectury {
	common()
}

task moveCommonBuilds() {
	doLast {
		delete fileTree("../build/libs").matching {
			include "**/MTR-common*"
		}
		delete fileTree("../build/latest").matching {
			include "**/MTR-common*"
		}
		if (rootProject.variation == "server") {
			copy {
				from "build/devlibs"
				include "*dev.jar"
				into "../build/libs"
				rename "(.+)", "MTR-\$1"
			}
			copy {
				from "build/devlibs"
				include "*dev.jar"
				into "../build/latest"
				rename { fileName -> "MTR-${fileName.replace(rootProject.mod_version, "latest")}" }
			}
		}
	}
}

afterEvaluate {
	for (def task in it.tasks) {
		if (task == tasks.build) {
			task.finalizedBy tasks.moveCommonBuilds
		}
	}
}

// Bundle the project's license and notice files in the mod jar. The common
// jar is shaded into the Fabric and Forge jars, so these files end up in
// META-INF/licenses/ in the final mod jar without duplicating the license
// texts in the source tree.
def bundledLicenseFiles = [
		"LICENSE"                  : "YMTR-LICENSE",
		"LICENSE-MIT"              : "YMTR-LICENSE-MIT",
		"LICENSE-GPL-3.0-or-later" : "YMTR-LICENSE-GPL-3.0-or-later",
		"NOTICE"                   : "YMTR-NOTICE",
		"TRADEMARK.md"             : "YMTR-TRADEMARK.md",
		"LICENSING.md"             : "YMTR-LICENSING.md"
]

processResources {
	bundledLicenseFiles.each { source, target ->
		from(rootProject.file(source)) {
			into "META-INF/licenses"
			rename { target }
		}
	}
}
