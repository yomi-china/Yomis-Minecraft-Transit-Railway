import org.apache.tools.ant.filters.ReplaceTokens

def minecraftVersion = "1.16.5"
def variation = providers.gradleProperty("variation").getOrElse("normal")
def patreonApiKey = providers.gradleProperty("patreonApiKey").getOrElse("")
def testServer = providers.gradleProperty("testServer").getOrElse("")
def modVersion = providers.gradleProperty("mod_version").get()

tasks.register("setupFiles") {
	doLast {
		copy { from "resources/common/lifts"; into "common/src/main/resources" }
		if (variation == "normal") copy { from "resources/common/normal"; into "common/src/main/resources" }
		if (variation == "normal" || variation == "server") {
			copy { from "resources/common/normal/data"; into "common/src/main/resources/data" }
			copy { from "resources/common/normal/assets/mtr/website"; into "common/src/main/resources/assets/mtr/website" }
			copy { from "resources/common/normal/assets/mtr/webdashboard"; into "common/src/main/resources/assets/mtr/webdashboard" }
		}
		copy { from "resources/fabric/" + (variation == "lifts" ? "lifts" : "normal"); into "fabric/src/main/resources" }
		copy { from "resources/forge/" + (variation == "lifts" ? "lifts" : "normal"); into "forge/src/main/resources" }
		copy {
			from "common/src/main/KeysTemplate.java"
			into "common/src/main/java/mtr"
			filter(ReplaceTokens, tokens: ["key": patreonApiKey, "version": minecraftVersion + "-" + modVersion, "lifts": variation, "server": testServer])
			rename "(.+)Template.java", "\$1.java"
		}
		copy {
			from "common/src/main/version-template.js"
			into "common/src/main/resources/assets/mtr/website"
			filter(ReplaceTokens, tokens: ["version": minecraftVersion + "-" + modVersion])
			rename "(.+)-template.js", "\$1.js"
		}
		copy {
			from "fabric/src/main/UnknownPacketMixinTemplate.java"
			into "fabric/src/main/java/mtr/mixin"
			filter(ReplaceTokens, tokens: ["path1": "apache/logging/log4j", "path2": "apache.logging.log4j"])
			rename "(.+)Template.java", "\$1.java"
		}
	}
}

def forgeJavaHome = file("C:/Users/FrostyHulan/.jdks/corretto-21.0.5")
def versions = ["1_16_5", "1_17_1", "1_18_2"]

def runChild = { String name, String directory, String task ->
	tasks.register(name, Exec) {
		dependsOn("setupFiles")
		workingDir = file(directory)
		if (directory == "forge") {
			environment "JAVA_HOME", forgeJavaHome.absolutePath
			environment "PATH", "${forgeJavaHome}/bin;${System.getenv('PATH')}"
		}
		ignoreExitValue = true
		commandLine "cmd", "/c", file("${directory}/gradlew.bat").absolutePath, task, "--no-daemon"
	}
}

def versionBuilds = versions.collectMany { version ->
	[runChild("fabricBuild_${version}", "fabric", ":${version}:build"),
	 runChild("forgeBuild_${version}", "forge", ":${version}:build")]
}

def buildSummary = tasks.register("buildSummary") {
	dependsOn(versionBuilds)
	doLast {
		def failed = versionBuilds.findAll { it.get().executionResult.get().exitValue != 0 }
		if (!failed.empty) {
			throw new GradleException("Failed builds: ${failed.collect { it.name }.join(', ')}")
		}
	}
}

tasks.register("build") {
	group = "build"
	description = "Builds all Fabric and Forge versions and reports failures at the end."
	dependsOn(buildSummary)
}

tasks.register("clean") {
	group = "build"
	dependsOn(runChild("fabricClean", "fabric", "clean"), runChild("forgeClean", "forge", "clean"))
}
