plugins {
	id "fabric-loom" version "1.6.12" apply false
	id "com.github.johnrengelman.shadow" version "+" apply false
}

def versions = [
	"1_16_5": [minecraft: "1.16.5", javaRelease: 8, loader: "0.18.4", fabricApi: "0.42.0+1.16", modMenu: "1.16.23", architecturyGroup: "me.shedaniel", architectury: "1.32.66"],
	"1_17_1": [minecraft: "1.17.1", javaRelease: 16, loader: "0.18.4", fabricApi: "0.46.0+1.17", modMenu: "3.0.1", architecturyGroup: "dev.architectury", architectury: "2.8.67"],
	"1_18_2": [minecraft: "1.18.2", javaRelease: 17, loader: "0.18.4", fabricApi: "0.77.0+1.18.2", modMenu: "3.2.5", architecturyGroup: "dev.architectury", architectury: "4.12.94"],
	"1_19_2": [minecraft: "1.19.2", javaRelease: 17, loader: "0.18.4", fabricApi: "0.77.0+1.19.2", modMenu: "4.2.0-beta.2", architecturyGroup: "dev.architectury", architectury: "6.6.92"],
	"1_19_4": [minecraft: "1.19.4", javaRelease: 17, loader: "0.18.4", fabricApi: "0.77.0+1.19.4", modMenu: "6.2.3", architecturyGroup: "dev.architectury", architectury: "8.2.89"]
]

allprojects {
	group = "mtr"
	version = "${findProperty("minecraftVersion") ?: "1.16.5"}-${findProperty("mod_version") ?: "3.6.4"}"
	repositories {
		// Fabric Loom resolves the 1.16.5 native libraries as LWJGL 3.3.2.
		// Keep the central repositories explicit because some configured mirrors
		// do not contain the LWJGL native artifacts.
		maven {
			name = "MavenCentralLWJGL"
			url = "https://maven.aliyun.com/repository/central/"
			content { includeGroup "org.lwjgl" }
		}
		maven {
			name = "MavenCentralLWJGLFallback"
			url = "https://repo.maven.apache.org/maven2/"
			content { includeGroup "org.lwjgl" }
		}
		mavenCentral()
		maven { url = "https://maven.fabricmc.net/" }
		maven { url = "https://maven.architectury.dev/" }
		maven { url = "https://maven.terraformersmc.com/" }
		maven { url = "https://jitpack.io/" }
		maven { url = "https://repo.papermc.io/repository/maven-public/" }
		maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
		flatDir { dirs "../../libs" }
	}
}

subprojects { project ->
	def config = versions[project.name]
	if (config == null) return
	apply plugin: "java"
	apply plugin: "fabric-loom"
	apply plugin: "com.github.johnrengelman.shadow"
	project.ext.minecraftVersion = config.minecraft
	version = "${config.minecraft}-${rootProject.findProperty("mod_version") ?: "3.6.4"}"

	loom {
		if (project.name == "1_17_1") {
			accessWidenerPath = file("src/main/resources/mtr.accesswidener")
		}
		mixin {
			defaultRefmapName = "mtr-refmap.json"
		}
	}
	configurations { shadowCommon }
	sourceSets.main {
		java.srcDirs = ["../../common/src/main/java", "../src/main/java", "src/main/java"]
		java.exclude "mtr/client/VoxyDepthCompat.java"
		def commonJava = rootProject.file("../common/src/main/java").toPath()
		java.exclude { entry -> entry.file.toPath().startsWith(commonJava) && entry.file.name in ["Registry.java", "RegistryClient.java"] }
		if (project.name in ["1_19_2", "1_19_4"]) {
			def versionJava = project.file("src/main/java").toPath()
			def overrides = fileTree(project.file("src/main/java")).matching { include "**/*.java" }.files.collect { versionJava.relativize(it.toPath()).toString() } as Set
			java.exclude { entry -> entry.file.toPath().startsWith(commonJava) && commonJava.relativize(entry.file.toPath()).toString() in overrides }
		}
		if (project.name != "1_16_5") {
			def platformJava = rootProject.file("src/main/java").toPath()
			java.exclude { entry -> entry.file.toPath().startsWith(platformJava) &&
				(entry.file.name == "EntitySetOldPosAndRotMixin.java" ||
					(project.name == "1_18_2" && entry.file.name == "UnknownPacketMixin.java")) }
		}
		resources.srcDirs = ["../../common/src/main/resources", "../src/main/resources", "src/main/resources"]
		if (project.name == "1_17_1") {
			def sharedResources = rootProject.file("src/main/resources").toPath()
			resources.exclude { entry -> entry.file.toPath().startsWith(sharedResources) && entry.file.name == "fabric.mod.json" }
		}
	}
	dependencies {
		minecraft "com.mojang:minecraft:${config.minecraft}"
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${config.loader}"
		modApi "net.fabricmc.fabric-api:fabric-api:${config.fabricApi}"
		modApi "com.terraformersmc:modmenu:${config.modMenu}"
		modApi "${config.architecturyGroup}:architectury-fabric:${config.architectury}"
		compileOnly "dev.architectury:architectury-injectables:1.0.10"
		implementation name: "Dynmap-3.2.1"
		implementation name: "BlueMapAPI-2.1.1"
		implementation "xyz.jpenilla:squaremap-api:1.2.1"
		implementation "net.kyori:adventure-api:4.13.1"
		implementation "net.kyori:adventure-text-minimessage:4.13.1"
		implementation "net.kyori:adventure-text-serializer-gson:4.13.1"
		implementation "org.eclipse.jetty:jetty-http:9.+"
		implementation "org.eclipse.jetty:jetty-io:9.+"
		implementation "org.eclipse.jetty:jetty-security:9.+"
		implementation "org.eclipse.jetty:jetty-server:9.+"
		implementation "org.eclipse.jetty:jetty-servlet:9.+"
		implementation "org.eclipse.jetty:jetty-util:9.+"
		implementation "org.eclipse.jetty:jetty-util-ajax:9.+"
		implementation "javax.servlet:javax.servlet-api:+"
		implementation "org.msgpack:msgpack-core:+"
		implementation "com.hierynomus:sshj:+"
		implementation "com.github.jonafanho:Minecraft-Mod-API-Tools:${rootProject.minecraft_mod_api_tools_version}"
		compileOnly files("../../libs/MSD1.3.4-common.jar")
		shadowCommon "org.eclipse.jetty:jetty-http:9.+"
		shadowCommon "org.eclipse.jetty:jetty-io:9.+"
		shadowCommon "org.eclipse.jetty:jetty-security:9.+"
		shadowCommon "org.eclipse.jetty:jetty-server:9.+"
		shadowCommon "org.eclipse.jetty:jetty-servlet:9.+"
		shadowCommon "org.eclipse.jetty:jetty-util:9.+"
		shadowCommon "org.eclipse.jetty:jetty-util-ajax:9.+"
		shadowCommon "javax.servlet:javax.servlet-api:+"
		shadowCommon "org.msgpack:msgpack-core:+"
		shadowCommon "com.googlecode.soundlibs:mp3spi:1.9.5.4"
		shadowCommon "com.googlecode.soundlibs:jlayer:1.0.1.4"
		shadowCommon "com.googlecode.soundlibs:tritonus-share:0.3.7.4"
	}
	processResources {
		inputs.property "version", project.version
		filesMatching("fabric.mod.json") { expand "version": project.version }
	}
	java {
		toolchain.languageVersion = JavaLanguageVersion.of(21)
		withSourcesJar()
	}
	tasks.withType(JavaCompile).configureEach {
		options.encoding = "UTF-8"
		options.release = config.javaRelease
		options.compilerArgs += ["-Xmaxerrs", "500"]
	}
	shadowJar {
		configurations = [project.configurations.shadowCommon]
		archiveClassifier = "dev-shadow"
		relocate "javax.servlet", "mtr.libraries.javax.servlet"
		relocate "org.eclipse", "mtr.libraries.org.eclipse"
		mergeServiceFiles()
	}
	remapJar {
		input.set shadowJar.archiveFile
		dependsOn shadowJar
		archiveClassifier = null
	}
}
